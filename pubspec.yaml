name: campus_on
description: A closed social network for verified university students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  firebase_core: ^2.32.0
  firebase_auth: ^4.17.5
  cloud_firestore: ^4.17.5
  glassmorphism: ^3.0.0 # Optional, but we can build custom too
  dotted_border: ^2.1.0 # For the ID upload container
  image_picker: ^1.1.2
  file_picker: ^8.0.0+1
  firebase_storage: ^11.6.5
  cached_network_image: ^3.3.0
  intl: ^0.18.1
  timeago: ^3.6.3
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - homepagelogo.png
    - Campus.png
    - campusapp.png

flutter_icons:
  android: true
  ios: true
  image_path: "campusapp.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "Campus.png"
  android: true
  ios: true
  android_12:
    image: "Campus.png"
    icon_background_color: "#FFFFFF"
